name: Check Gate CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  actions: read
  contents: read

concurrency:
  group: check-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-gate:
    name: Check Gate CI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait for required workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          expected=(
            "CI"
            "Changelog"
            "Govulncheck"
          )

          echo "Waiting for workflows: ${expected[*]}"
          echo "head_sha=$HEAD_SHA"

          deadline=$((SECONDS + 115 * 60))
          while (( SECONDS < deadline )); do
            runs_json="$(gh api \
              "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")"

            failed=0
            pending=0
            for name in "${expected[@]}"; do
              row="$(jq -c --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)]
                | sort_by(.id)
                | reverse
                | if length == 0 then empty
                  else .[0] | {status, conclusion, html_url}
                  end
              ' <<<"$runs_json")"

              if [[ -z "$row" ]]; then
                echo "PENDING  $name (not started)"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<<"$row")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$row")"
              url="$(jq -r '.html_url' <<<"$row")"

              if [[ "$status" != "completed" ]]; then
                echo "PENDING  $name ($status) $url"
                pending=1
                continue
              fi

              if [[ "$conclusion" == "success" ]]; then
                echo "OK       $name $url"
                continue
              fi

              echo "FAILED   $name ($conclusion) $url"
              failed=1
            done

            if (( failed )); then
              echo "One or more required workflows failed."
              exit 1
            fi
            if (( pending == 0 )); then
              echo "All required workflows succeeded."
              exit 0
            fi
            sleep 30
          done

          echo "Timed out waiting for required workflows."
          exit 1
